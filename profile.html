<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
display:flex;
font-family:'Outfit',sans-serif;
background:#6610f2;
min-height:100vh;
}

/* SAME SIDEBAR AS DASHBOARD */
        /* Sidebar */
        nav {
            background-color: #ff9f43;
            width: 240px;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 4px 0 15px rgba(0,0,0,0.15);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link-custom {
            color: #4a2e00;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 15px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .nav-link-custom:hover {
            background-color: rgba(255,255,255,0.4);
        }

        .active-link {
            background-color: #ffffff;
            color: #ff7a00;
            font-weight: 600;
        }

        .logout-link {
            color: #b00020;
            margin-top: 15px;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 15px;
        }

/* MAIN */
main{
flex-grow:1;
padding:50px;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

/* MATCH DASHBOARD CARD STYLE */
.profile-card{
background:#ffffff;
color:#333;
padding:30px;
border-radius:18px;
width:100%;
max-width:500px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
text-align:center;
}

/* PROFILE PIC */
.pic-circle{
width:130px;
height:130px;
background:#ffe0b3;
border-radius:50%;
margin:0 auto 15px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
border:4px solid #6610f2;
}

#imgPrev{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

/* FORM */
.field-group{
text-align:left;
margin-bottom:12px;
}

label{
font-weight:600;
font-size:0.85rem;
color:#cc6600;
}

input, select{
width:100%;
padding:8px 10px;
border:1px solid #ddd;
border-radius:8px;
background:#f8f9fa;
font-size:0.9rem;
}

/* BUTTONS (MATCH SYSTEM) */
.btn-main{
background:#ffe0b3;
color:#cc6600;
border:none;
padding:10px;
border-radius:8px;
font-weight:600;
width:100%;
margin-top:10px;
}

/* FOOTER SAME */
footer{
position:fixed;
bottom:0;
left:240px;
width:calc(100% - 240px);
background:#4b2bbd;
color:white;
text-align:center;
padding:12px;
font-size:0.8rem;
}

</style>
</head>

<body>

<nav>
<div style="text-align:center;margin-bottom:20px;">
<img src="logo.png" width="80">
</div>

<div class="nav-menu">
<a href="dashboard.html" class="nav-link-custom">Dashboard</a>
<a href="notebooks.html" class="nav-link-custom">Virtual Notebooks</a>
<a href="tasks.html" class="nav-link-custom">Tasks</a>
<a href="profile.html" class="nav-link-custom active-link">Profile</a>
<a href="index.html" class="nav-link-custom logout-link">Logout</a>
</div>
</nav>

<main>

<div class="profile-card">

<h2 class="fw-bold mb-3">Profile</h2>

<div class="pic-circle">
<img id="imgPrev">
</div>

<input type="file" id="filePick" style="margin-bottom:10px;" accept="image/*">
<button class="btn-main" onclick="uploadImg()">Upload Photo</button>

<div class="field-group">
<label>Student ID</label>
<input type="text" placeholder="1041676767">
</div>

<div class="field-group">
<label>Contact Number</label>
<input type="text" placeholder="0917...">
</div>

<div class="field-group">
<label>Email</label>
<input type="text" placeholder="student@email.com">
</div>

<div class="field-group">
<label>Gender</label>
<select>
<option>Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<button class="btn-main" onclick="changePass()">Change Password</button>

</div>

</main>


<script>
function uploadImg(){
const fileInput=document.getElementById('filePick');
const preview=document.getElementById('imgPrev');

if(fileInput.files && fileInput.files[0]){
const reader=new FileReader();
reader.onload=function(e){
preview.src=e.target.result;
preview.style.display="block";
}
reader.readAsDataURL(fileInput.files[0]);
}else{
alert("pick a file first");
}
}

function changePass(){
alert("redirecting...");
}
</script>
    <footer>
        <p style="margin:0;"><b>Created by:</b> Cheree Mendoza, Zoey Ledres, Princess Schwab, Elise Ramos || 9-Topaz</p>

    </footer>

</body>
</html>

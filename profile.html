    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
    /*Guys pls finish this styling by tonight*/
    /*Credits to myself since I don't wanna self plagiarize. I extracted some of my old code onto this also the Skills Test 4Q too.*/
        body {
         margin: 0;
         display: flex;
         font-family: 'Segoe UI', sans-serif;
         background-color: #6610f2; 
         min-height: 100vh;
        }
        nav {
            background-color: #ffb35c;
            width: 250px;
            padding: 40px 15px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .nav-link-custom {
            color: #2b1d52;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 20px;
            margin-bottom: 8px;
            border-radius: 12px;
        }

        /* This is the main stuff na */
        main {
            flex-grow: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /*elise's part*/
        .profile-card {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .pic-circle {
            width: 140px;
            height: 140px;
            background-color: #ffb35c;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #6610f2;
        }

        #imgPrev {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .field-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #6610f2;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f8f9fa;
        }

        .btn-cyan {
            background-color: #3fe0f1;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            padding: 8px 20px;
            margin-bottom: 20px;
        }

        .btn-pass {
            background-color: #ffb35c;
            color: #2b1d52;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }


        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            right: 0;
            width: calc(100% - 250px);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <nav>
        <div class="text-center mb-5">
            <img src="C:\Users\chere\Downloads\3265e787-f435-4aa9-97e7-2388f6029cd1-removebg-preview.png" alt="Logo" width="90">
        </div>
        <a href="dashboard.html" class="nav-link-custom">Dashboard</a>
        <a href="notebooks.html" class="nav-link-custom">Virtual Notebooks</a>
        <a href="tasks.html" class="nav-link-custom">Tasks</a>
        <a href="profile.html" class="nav-link-custom active-link">Profile</a>
        <a href="index.html" class="nav-link-custom" style="color: #d00; border-top: 1px solid rgba(0,0,0,0.1); margin-top: 10px; padding-top: 20px;">Logout</a>
    </nav>

    <main>
        <div class="profile-card">
            <h2 class="fw-bold mb-4" style="color: #333;">Profile</h2>

            <div class="pic-circle">
                <img id="imgPrev" src="#" alt="User Photo">
            </div>
            <input type="file" id="filePick" class="form-control form-control-sm mb-2" accept="image/*">
            <button class="btn-cyan" onclick="uploadImg()">Choose File</button>

            <div class="field-group">
                <label>Student ID</label>
                <input type="text" id="stuID" placeholder="e.g. 1041676767">
            </div>

            <div class="field-group">
                <label>Contact Number</label>
                <input type="text" id="cNum" placeholder="09176767">
            </div>

            <div class="field-group">
                <label>Email Address</label>
                <input type="text" id="email" placeholder="student@slayqueenschool">
            </div>

            <div class="field-group text-start">
                <label>Gender</label>
                <select id="gen">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button class="btn-pass" onclick="changePass()">Change Password</button>
        </div>
    </main>

    <footer>
        Created by: Cheree Mendoza, Zoey Ledres, Princess Schwab, Elise Ramos | 9-Topaz | Source: gemini.google.com
    </footer>

    <script>
        function uploadImg() {
            const fileInput = document.getElementById('filePick');
            const preview = document.getElementById('imgPrev');
            
            if (fileInput.files && fileInput.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result; 
                    preview.style.display = "block"; 
                }
                reader.readAsDataURL(fileInput.files[0]);
                alert("Photo uploaded!");
            } else {       
                alert("Please select a file first.");
            }
        }

        function changePass() {
            alert("Redirecting to password reset...");
        }
    </script>

</body>
</html>

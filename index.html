<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font --> <link href="https://fonts.googleapis.com/css2 family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #6610f2, #9054ff);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }

        #login-container {
            background-color: #fff;
            width: 360px;
            padding: 35px;
            border-radius: 20px;
            margin: auto;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #4b2bbd;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .my-input {
            border-radius: 20px;
            border: 1px solid #ddd;
            padding: 10px 15px;
            width: 100%;
            margin-bottom: 15px;
            transition: 0.2s;
        }

        .my-input:focus {
            border-color: #6610f2;
            outline: none;
            box-shadow: 0 0 5px rgba(102,16,242,0.3);
        }

        .login-btn {
            background-color: #6610f2;
            color: white;
            border-radius: 20px;
            padding: 10px;
            width: 100%;
            border: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .login-btn:hover {
            background-color: #4b2bbd;
        }

footer{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#4b2bbd;
color:white;
text-align:center;
padding:12px;
font-size:0.8rem;
}
    </style>
</head>

<body>

    <div id="login-container">
    <img 
    src="C:\Users\chere\Downloads\3265e787-f435-4aa9-97e7-2388f6029cd1-removebg-preview.png" alt="Logo" width="80" style="margin-bottom: 10px;">
    <h1>Login</h1>

        <form>
        <div style="text-align:left;">
        <label><b>Username</b></label>
        <input type="text" id="user" class="my-input" placeholder="Enter username">

            <label><b>Password</b></label>
            <input type="password" id="pass" class="my-input" placeholder="Enter password">
            </div>

            <div style="text-align:left; margin-bottom: 15px;">
            <input type="checkbox" id="stay">
            <label for="stay"> Stay logged in</label>
            </div>

        <button type="button" class="login-btn" onclick="validate()">Login</button>
        </form>
    </div>

        <script>
        function validate() {
            var username = document.getElementById("user").value;
            if (username === "") {
                alert("Please enter a username!");
            } else {
                window.location.href = "dashboard.html";
            }
        }
    </script>

    <footer>
        <p style="margin:0;"><b>Created by:</b> Cheree Mendoza, Zoey Ledres, Princess Schwab, Elise Ramos || 9-Topaz</p>
        <p style="margin:0;">Source of new code - https://www.w3schools.com/</p>
    </footer>

</body>
</html>

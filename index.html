<!DOCTYPE html>
<html>
<head>
    <title>LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    <style>
        /*Cheree did this page. Also sir I'm just gonna be honest, I needed a lot of assistance to do this. But I promise I didn't AI everything. I genuinely tried. I'm sorry coding isn't my thing. Thank you. 😭*/
    body {
        background-color: #6610f2;
        display: flex;
        flex-direction: column; /*searched this up*/
        min-height: 100vh;
        margin: 0;
        font-family: sans-serif;
        }

        #login-container {
            background-color: #ffb35c;
            width: 380px;
            padding: 40px;
            border-radius: 30px;
            margin: auto;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2); /*searched this up*/
        }
        /*styling for the input*/
        .my-input {
        border-radius: 25px;
        border: none;
        padding: 12px 20px;
        width: 100%;
        margin-top: 5px;
        margin-bottom: 20px;
        }

        .login-btn {
            background-color: #6610f2;
            color: rgb(255, 255, 255);
            border-radius: 25px;
            padding: 10px 50px;
            border: none;
            font-weight: bold;
            font-size: 1.1rem; /*<--gemini helped with this*/
        }

        footer {
            background-color: #9054ff;
            color: #333;
            text-align: center;
            padding: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="login-container">
        <img src="C:\Users\chere\Downloads\3265e787-f435-4aa9-97e7-2388f6029cd1-removebg-preview.png" alt="Logo" width="100">
        
     <h1 style="color: #2b1d52; font-weight: 800; margin-bottom: 30px;">Login</h1>

        <form>
        <div style="text-align: left;">
        <label><b>Username</b></label>
        <input type="text" id="user" class="my-input" placeholder="Enter here">
                
            <label><b>Password</b></label>
            <input type="password" id="pass" class="my-input" placeholder="Enter here">
         </div>

            <div style="text-align: left; margin-bottom: 20px;">
            <input type="checkbox" id="stay"> 
                <label for="stay">Stay logged in?</label>
            </div>

    <button type="button" class="login-btn" onclick="validate()">Login</button>
     </form>
    </div>

    <footer>
        <p style="margin: 0;">
            <b>Created by:</b> Cheree Mendoza, Zoey Ledres, Princess Schwab, Elise Ramos | 
            <b>Section:</b> 9 - Topaz
        </p>
        <p style="margin: 0; font-size: 0.8rem;">
            <b>Source:</b> gemini.google.com
        </p>
    </footer>

    <script>
        function validate() {
        var username = document.getElementById("user").value; 
          if (username == "") {
                alert("Please enter a username!");
            } else {
                window.location.href = "dashboard.html";
            }
     }
    </script>
</body>
</html>

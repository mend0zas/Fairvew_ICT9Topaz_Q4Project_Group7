<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTEBOOKS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /*cheree+princess*/
        body {
            margin: 0;
            display: flex;
            font-family: 'Segoe UI', sans-serif;
            background-color: #6610f2;
            min-height: 100vh;
        }

        nav {
            background-color: #ffb35c;
            width: 250px;
            padding: 40px 15px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .nav-link-custom {
            color: #2b1d52;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 20px;
            margin-bottom: 8px;
            border-radius: 12px;
        }
        .active-link {
            background-color: rgba(255, 255, 255, 0.4);
        }

        main {
            flex-grow: 1;
            padding: 50px;
            color: white;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;
            margin-top: 30px;
        }

        .notebook-card {
            background-color: #ffffd1; /* Cream/Yellow */
            border: none;
            border-radius: 15px;
            padding: 25px;
            text-align: left;
            color: #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 100%;
        }
        .class-info {
            font-size: 0.8rem;
            color: #666;
            margin: 5px 0 15px 0;
        }

        .teacher {
            font-style: italic;
            font-weight: bold;
            color: #444;
        }

        footer {
            background-color: #333;
            color: #ccc;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            right: 0;
            width: calc(100% - 250px);
            font-size: 0.8rem;
        }

</head>
<body>

    <nav>
     <div class="text-center mb-5">

            <button class="notebook-card" onclick="openMsg('Science')">

                <p class="class-info">9-Topaz | 2025-2026</p>
                <span class="teacher">Sir Renn</span>

        </div>

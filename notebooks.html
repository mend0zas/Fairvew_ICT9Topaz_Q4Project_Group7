<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Notebooks</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
margin:0;
display:flex;
font-family:'Outfit',sans-serif;
background-color:#6610f2;
min-height:100vh;
}

/* sidebar */
nav{
background-color:#ff9f43;
width:250px;
padding:30px 15px;
display:flex;
flex-direction:column;
flex-shrink:0;
box-shadow:4px 0 15px rgba(0,0,0,0.15);
}

.nav-link-custom{
color:#4a2e00;
text-decoration:none;
font-weight:500;
padding:10px 15px;
margin-bottom:8px;
border-radius:10px;
transition:0.2s;
}

.nav-link-custom:hover{
background-color:rgba(255,255,255,0.4);
}

.active-link{
background-color:#fff;
color:#ff7a00;
font-weight:600;
}

.logout-link{
color:#b00020;
border-top:1px solid rgba(0,0,0,0.1);
margin-top:10px;
padding-top:15px;
}

/* main */
main{
flex-grow:1;
padding:50px;
padding-bottom:80px;
color:white;
}

/* grid */
.subject-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;
}

/* cards */
.notebook-card{
background-color:#ffffd1;
border-radius:15px;
padding:20px;
text-align:left;
color:#333;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
border:none;
transition:0.2s;
cursor:pointer;
}

.notebook-card:hover{
transform:translateY(-5px);
}

.class-info{
font-size:0.8rem;
color:#666;
margin:5px 0 10px;
}

.teacher{
color:#444;
font-style:italic;
font-weight:500;
}

/* footer */
footer{
position:fixed;
bottom:0;
left:250px;
width:calc(100% - 250px);
background-color:#4b2bbd;
color:white;
text-align:center;
padding:10px;
font-size:0.8rem;
}

</style>
</head>

<body>

<nav>
<div class="text-center mb-4">
<img src="logo.png" alt="Logo" width="90">
</div>

<a href="dashboard.html" class="nav-link-custom">Dashboard</a>
<a href="notebooks.html" class="nav-link-custom active-link">Virtual Notebooks</a>
<a href="tasks.html" class="nav-link-custom">Tasks</a>
<a href="profile.html" class="nav-link-custom">Profile</a>

<a href="index.html" class="nav-link-custom logout-link">Logout</a>
</nav>

<main>

<h1 class="fw-bold">Virtual Notebooks</h1>
<p>Select a subject to view your notes:</p>

<div class="subject-grid">

<button class="notebook-card" onclick="openMsg('Filipino')">
<h5 class="fw-bold">Filipino</h5>
<p class="class-info">9-Topaz | 2025–2026</p>
<span class="teacher">Ms. Francisco</span>
</button>

<button class="notebook-card" onclick="openMsg('English')">
<h5 class="fw-bold">English</h5>
<p class="class-info">9-Topaz | 2025–2026</p>
<span class="teacher">Ms. Avila</span>
</button>

<button class="notebook-card" onclick="openMsg('Mathematics')">
<h5 class="fw-bold">Mathematics</h5>
<p class="class-info">9-Topaz | 2025–2026</p>
<span class="teacher">Sir Ramos</span>
</button>

<button class="notebook-card" onclick="openMsg('Science')">
<h5 class="fw-bold">Science</h5>
<p class="class-info">9-Topaz | 2025–2026</p>
<span class="teacher">Ms. Mendoza</span>
</button>

<button class="notebook-card" onclick="openMsg('TLE')">
<h5 class="fw-bold">TLE</h5>
<p class="class-info">9-Topaz | 2025–2026</p>
<span class="teacher">Ms. Del Barrio</span>
</button>

<button class="notebook-card" onclick="openMsg('ICT')">
<h5 class="fw-bold">ICT</h5>
<p class="class-info">9-Topaz | 2025–2026</p>
<span class="teacher">Sir Renn</span>
</button>

</div>
</main>

<footer>
Created by: Cheree Mendoza, Zoey Ledres, Princess Schwab, Elise Ramos | 9 - Topaz
</footer>

<script>
function openMsg(subject){
alert("Opening your "+subject+" Virtual Notebook...");
}
</script>

</body>
</html>
